<div class="sommaire">
<h2>Au programme</h2>
<p class="definition">Sourate Az-zalzala (le Séisme)</p>
<p class="definition">Mœurs islamiques : La bienfaisance envers les parents</p>
<p class="definition">Révision et évaluation</p>
</div>

<div class="topline">
  <span>Au cœur du Coran</span>
  <strong>Az-zalzala (le Séisme)</strong>
</div>

<div class="lg" aria-label="Code couleur du tajwid">
<span><em><i style="background:#3f51b5"></i>Tafkhim</em><b lang="ar">تفخيم</b></span>
<span><em><i style="background:#2e8b3a"></i>Ikhfa, ghunna</em><b lang="ar">إخفاء ومواضع الغنة</b></span>
<span><em><i style="background:#9a9a9a"></i>Idgham, lettre non prononcée</em><b lang="ar">إدغام وما لا يُلفظ</b></span>
<span><em><i style="background:#b8921a"></i>Madd de 2 temps</em><b lang="ar">مدّ حركتان</b></span>
<span><em><i style="background:#e53935"></i>Madd de 4 ou 5 temps</em><b lang="ar">مدّ واجب أو ٤ أو ٥ حركات</b></span>
</div>
<h2>Je retiens</h2>

<p class="arv basm" lang="ar">بِسْمِ ٱللَّهِ ٱ<x>ل</x><t>رَّ</t>حْمَ<d>ـٰ</d>نِ ٱ<x>ل</x><t>رَّ</t>حِ<w>ي</w>مِ</p>
<p class="basmala">
Au nom de Dieu, le Clément, le Miséricordieux
</p>

<ol class="verses">
  <li><span class="arv" lang="ar">إِذَا زُلْزِلَتِ ٱلْأَ<t>رْضُ</t> زِلْزَالَهَا</span><span class="frv"><span class="n">[1]</span>Lorsque la terre sera secouée par son ultime séisme ;</span></li>
  <li><span class="arv" lang="ar">وَأَ<t>خْرَ</t>جَتِ ٱلْأَ<t>رْضُ</t> أَثْ<t>قَ</t>الَهَا</span><span class="frv"><span class="n">[2]</span>lorsqu’elle expulsera de ses entrailles ses lourdes charges ;</span></li>
  <li><span class="arv" lang="ar">وَ<t>قَ</t>الَ ٱلْإِ<g>ن</g>سَ<d>ـٰ</d>نُ مَا لَهَا</span><span class="frv"><span class="n">[3]</span>lorsque l’homme dira : « Qu’a-t-elle donc ? »</span></li>
  <li><span class="arv" lang="ar">يَوْمَئِذٍ تُحَدِّثُ أَ<t>خْ</t>بَا<t>رَ</t>هَا</span><span class="frv"><span class="n">[4]</span>Ce Jour-là, la terre contera son histoire,</span></li>
  <li><span class="arv" lang="ar">بِأَ<g>نَّ</g> <t>رَ</t>بَّكَ أَوْحَىٰ لَهَا</span><span class="frv"><span class="n">[5]</span>selon ce que ton Seigneur lui aura révélé.</span></li>
</ol>

<h2>Je comprends le vocabulaire</h2>

<p class="definition">
Son ultime séisme : son dernier tremblement, le plus violent.
</p>

<p class="definition">
Ses lourdes charges : les morts, tout ce qui a été enterré en son sein.
</p>

<section class="meaning">
<h2>Je comprends le sens des versets</h2>
<p class="vref">Versets [1] et [2]</p>

<p class="bullet">
À la fin des temps et l’arrivée du <span class="o">jour dernier</span>,
</p>

<p class="bullet">
la terre sera prise par un <strong>tremblement</strong> de terre avec des <span class="o">secousses très violentes</span>.
</p>

<p class="bullet">
Elle sortira ses <span class="o">morts</span>, ses <span class="o">trésors</span>, et ses <span class="o">secrets</span>.
</p>

<p class="vref">Versets [3], [4] et [5]</p>

<p class="bullet">
Ceux qui <span class="o">ne croyaient pas</span> au jour du jugement seront surpris.
</p>

<p class="bullet">
La terre <span class="o">témoignera</span> sur toutes les actions de chacun de nous.
</p>

<p class="bullet">
La Terre a été <span class="o">témoin des moindres faits</span> et gestes des êtres qui se trouvaient à sa surface.
</p>



<p class="bullet">
Le jour de la Résurrection, Dieu ordonnera à la terre de trembler violemment.
</p>

<p class="bullet">
Dieu ressuscitera les morts pour le Jugement dernier.
</p>

<p class="bullet">
La terre témoignera des actes de chaque individu dans ce bas-monde.
</p>
</section>

<section class="learning">
<h2>J’apprends</h2>

<p class="bullet">
Je redoute le Jour de la Résurrection et les événements épouvantables qui l’accompagneront.
</p>

<p class="bullet">
Je m’applique à accomplir les bonnes œuvres tant que je suis encore en vie.
</p>
</section>

<h2>J’enrichis mes connaissances</h2>

<p class="arabic" lang="ar">
قَالَ اللَّهُ تَعَالَىٰ:
إِنَّ زَلْزَلَةَ السَّاعَةِ شَيْءٌ عَظِيمٌ ۝
</p>

<p class="translation">
Dieu (Gloire à Lui) a dit :
</p>

<p class="quote">
« Ô hommes ! Craignez votre Seigneur, car le séisme [qui précédera] l’Heure sera quelque chose de terrifiant !
<span class="source">Coran, sourate n° 22, verset n° 1.</span>
</p>

<!-- SUITE DE LA SOURATE -->

<section class="continuation">

<h2>Je retiens</h2>

<p class="arv basm" lang="ar">بِسْمِ ٱللَّهِ ٱ<x>ل</x><t>رَّ</t>حْمَ<d>ـٰ</d>نِ ٱ<x>ل</x><t>رَّ</t>حِ<w>ي</w>مِ</p>
<p class="basmala">
Au nom de Dieu, le Clément, le Miséricordieux
</p>

<ol class="verses" start="6">
  <li><span class="arv" lang="ar">يَوْمَئِذٍ <g>يَ</g><t>صْ</t>دُ<t>رُ</t> ٱ<x>ل</x><g>نَّ</g>اسُ أَشْتَاتًا لِّيُ<t>رَ</t>وْا۟ أَعْمَ<d>ـٰ</d>لَهُمْ</span><span class="frv"><span class="n">[6]</span>Ce Jour-là, les êtres humains sortiront [de leurs tombes] séparément, pour que leur soient montrées leurs œuvres.</span></li>

  <li><span class="arv" lang="ar">فَمَ<x>ن</x> <g>يَ</g>عْمَلْ مِثْ<t>قَ</t>الَ ذَ<t>رَّ</t>ةٍ <t>خَ</t>يْ<t>رً</t>ا يَ<t>رَ</t>هُ<d>ۥ</d></span><span class="frv"><span class="n">[7]</span>Quiconque fait donc un bien, fût-ce du poids d’un atome, le verra.</span></li>

  <li><span class="arv" lang="ar">وَمَ<x>ن</x> <g>يَ</g>عْمَلْ مِثْ<t>قَ</t>الَ ذَ<t>رَّ</t>ةٍ شَ<t>رًّ</t><x>ا</x> يَ<t>رَ</t>هُ<d>ۥ</d></span><span class="frv"><span class="n">[8]</span>Et quiconque fait un mal, fût-ce du poids d’un atome, le verra.</span></li>
</ol>

<h2>Je comprends</h2>

<p class="definition">
Le Jour de la Résurrection, Dieu exposera à chacun tous ses actes.
</p>

<p class="definition">
Dieu récompensera chaque être humain pour ce qu’il avait fait de bien ou de mal, même si cela fut minime.
</p>

<section class="learning">
<h2>J’apprends</h2>

<p class="bullet">
Je fais beaucoup de bonnes actions, y compris celles qui paraissent les moins importantes.
</p>

<p class="bullet">
Je m’éloigne de toute mauvaise action, même si je considère qu’elle n’est pas très grave.
</p>
</section>

<h2>J’enrichis mes connaissances</h2>

<p class="arabic" lang="ar">
قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ:
«اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ»
</p>

<p class="translation">
Le Messager de Dieu ﷺ a dit :
</p>

<p class="quote">
« Évitez l’enfer, fût-ce en [offrant] la moitié d’une datte [en Aumône] »
</p>

<section class="meaning">
<h2>Je comprends le sens des versets</h2>

<p class="vref">Verset [6]</p>

<p class="bullet">
Chaque être humain <span class="o">aura son livre</span> contenant la moindre des choses.
</p>

<p class="bullet">
C’est l’heure de <span class="o">justifier et rendre compte</span> de toute action réalisée sur terre.
</p>

<p class="bullet">
Il est <span class="o">impossible de nier</span> quoi que ce soit.
</p>

<p class="vref">Versets [7] et [8]</p>

<p class="bullet">
Celui qui fait un acte de la taille d’une minuscule fourmi jaune, de :
</p>

<p class="bullet sub">
<span class="og">Bien</span> le verra écrit dans son livre et pesé dans sa balance
</p>

<p class="bullet sub">
<span class="o">Mal</span> le verra écrit dans son livre et pesé dans sa balance
</p>

<p class="bullet">
une parole, un mot, un message
</p>

<p class="bullet">
un sourire,
</p>

<p class="bullet">
un regard,
</p>

<p class="bullet">
une conjecture,
</p>

<p class="bullet">
…etc.
</p>
</section>

</section>

<main>
<!-- LEÇON : LA BIENFAISANCE ENVERS LES PARENTS -->

<section class="continuation parents">

<div class="topline">
  <span>Mœurs islamiques</span>
  <strong>La bienfaisance envers les parents</strong>
</div>

<h2>Je retiens</h2>

<p class="arabic" lang="ar">
سُئِلَ رَسُولُ اللَّهِ ﷺ:
«أَيُّ الْعَمَلِ أَحَبُّ إِلَى اللَّهِ؟»
قَالَ: «الصَّلَاةُ عَلَى وَقْتِهَا».
قِيلَ: ثُمَّ أَيٌّ؟
قَالَ: «ثُمَّ بِرُّ الْوَالِدَيْنِ»
</p>

<p class="translation">
Quelle est l’œuvre que Dieu aime le plus ? » demanda-t-on au Messager de Dieu ﷺ.
Il répondit :
<span class="quote-inline">| La Prière accomplie en son temps |</span>
<br>
« Puis quoi d’autre ? » lui demanda-t-on de nouveau.
<br>
Il répondit :
<span class="quote-inline">| Puis la bienfaisance envers les parents |</span>
</p>

<h2>Je comprends</h2>

<p class="definition">
<strong style="color:#8c9a61">Dieu aime</strong>
le musulman qui accomplit ses Prières (Salat) à temps.
</p>

<p class="definition">
Le musulman qui aime ses parents, leur obéit et leur apporte son aide.
</p>

<section class="learning">
<h2>J’apprends</h2>

<p class="bullet">
J’agis avec bonté envers ma mère et mon père.
</p>

<p class="bullet">
Je n’oublie jamais les efforts qu’ils ont faits pour m’élever.
</p>

<p class="bullet">
J’invoque Dieu en leur faveur.
</p>
</section>

<h2>J’enrichis mes connaissances</h2>

<p class="arabic" lang="ar">
قَالَ اللَّهُ تَعَالَىٰ:
﴿وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ
وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾
</p>

<p class="translation">
Dieu (<em>Gloire à Lui</em>) a dit :
<span class="quote-inline">
| Et par miséricorde, fais preuve à leur égard (les parents) d’humilité et dis [souvent] : « Mon Seigneur ! Sois clément envers eux comme ils l’ont été envers moi, quand ils m’ont élevé » |
</span>
</p>

<p class="source" style="text-align:center; display:block; margin-top:10px;">
Coran, sourate n° 17, verset n° 24.
</p>

</section>

<section class="exercice">

<ul class="cases">
<li><span class="case"></span><span>Ordonnera à la terre de trembler violemment.</span></li>
<li><span class="case"></span><span>Ne montrera pas aux êtres humains leurs actes.</span></li>
<li><span class="case"></span><span>Exposera à chacun tous ses actes, mêmes les moins importants.</span></li>
<li><span class="case"></span><span>Ne jugera que les mauvais actes commis par les hommes.</span></li>
</ul></section>
